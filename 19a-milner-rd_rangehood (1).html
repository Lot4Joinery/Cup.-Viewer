var fillMat=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2});
var lineMat=new THREE.LineMaterial({color:0x000000,linewidth:2*Math.min(devicePixelRatio,2)});
function apply(){
  var ref=mode==="ref";
  renderer.domElement.style.display=ref?"none":"block";
  shot.hidden=!ref;chips.hidden=ref;
  meshes.forEach(function(o){
    o.visible=!off[o.userData.key];
    o.material=mode==="solid"?o.userData.orig:(mode==="hidden"?fillMat:hideMat);
    o.userData.edges.visible=(mode==="hidden"||mode==="wire");
  });
}
function size(){var w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);lineMat.resolution.set(w*renderer.getPixelRatio(),h*renderer.getPixelRatio());camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",size);
function label(n){n=n.split(".")[0].split("_").join(" ");return n.indexOf("Effect-")===0?"Colour "+n.slice(7):n;}
if(D.img){document.getElementById("img").src=D.img;document.getElementById("refbtn").hidden=false;
  shot.onclick=function(){shot.classList.toggle("z");};}
try{
  var bin=atob(D.glb),buf=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  new THREE.GLTFLoader().parse(buf.buffer,"",function(gltf){
    var group=new THREE.Group();group.add(gltf.scene);scene.add(group);group.updateMatrixWorld(true);
    var box=new THREE.Box3().setFromObject(group),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
    group.position.sub(c);
    document.getElementById("dims").textContent="Rev "+D.rev+"  |  approx "+Math.round(s.x*1000)+" x "+Math.round(s.y*1000)+" x "+Math.round(s.z*1000)+" mm";
    var seen={};
    var list=[];gltf.scene.traverse(function(o){if(o.isMesh)list.push(o);});
    list.forEach(function(o){{
      o.userData.orig=o.material;o.userData.key=o.material.name;
      var e=new THREE.LineSegments2(new THREE.LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry,20)),lineMat);
      o.add(e);o.userData.edges=e;meshes.push(o);
      if(!seen[o.material.name]){seen[o.material.name]=1;
        var b=document.createElement("button");b.textContent=label(o.material.name);
        b.onclick=function(){var k=o.userData.key;off[k]=!off[k];b.classList.toggle("off",!!off[k]);apply();};
        chips.appendChild(b);}
    }});
    var d=s.length();
    home=new THREE.Vector3(0.9,0.5,1.4).normalize().multiplyScalar(d*1.7);
    camera.position.copy(home);controls.minDistance=d*0.3;controls.maxDistance=d*5;controls.update();
    msg.remove();size();apply();
  },function(){msg.textContent="Could not load model";});
}catch(e){msg.textContent="Could not load model";}
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){
  mode=b.dataset.m;document.querySelectorAll("[data-m]").forEach(function(x){x.classList.toggle("on",x===b);});apply();};});
document.getElementById("reset").onclick=function(){if(home){camera.position.copy(home);controls.target.set(0,0,0);controls.update();}};
size();
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
</script></body></html>
